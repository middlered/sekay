name: Android Package Workflow
on:
  repository_dispatch:
    types: [android-fetch]
  
  workflow_dispatch:
    inputs:
      app_version_code:
        description: 'App Version Code'
        required: false
        type: string
      download_url:
        description: 'Direct XAPK download URL (overrides App Version Code)'
        required: false
        type: string
        default: ''
      run_analyze:
        required: false
        default: true
        type: boolean

jobs:
  uni_env:
    runs-on: ubuntu-latest
    outputs:
      app_version_code: ${{ steps.combiner.outputs.app_version_code }}
      download_url: ${{ steps.combiner.outputs.download_url }}
      run_analyze: ${{ steps.combiner.outputs.run_analyze }}
    steps:
      - id: combiner
        env:
          VERSION: ${{ github.event.inputs.app_version_code || github.event.client_payload.app_version_code }}
          DOWNLOAD_URL: ${{ github.event.inputs.download_url || github.event.client_payload.download_url }}
          ANALYZE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_analyze || toJSON(github.event.client_payload.run_analyze) }}
        run: |
          if [ -z "$ANALYZE" ] || [ "$ANALYZE" = "null" ]; then ANALYZE="true"; fi
          if [[ "$DOWNLOAD_URL" == *$'\n'* || "$DOWNLOAD_URL" == *$'\r'* ]]; then
            echo "Download URL must be a single line" >&2
            exit 1
          fi

          echo "app_version_code=$VERSION" >> "$GITHUB_OUTPUT"
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "run_analyze=$ANALYZE" >> "$GITHUB_OUTPUT"

  get-package:
    needs: uni_env
    permissions:
      contents: write
    uses: ./.github/workflows/apkpure.yml
    with:
      app_version_code: ${{ needs.uni_env.outputs.app_version_code }}
      download_url: ${{ needs.uni_env.outputs.download_url }}
      to_apk: true
      update_version: true

  patch-apk-fixed:
    needs: get-package
    if: needs.get-package.outputs.flow_skip != 'true'
    uses: ./.github/workflows/patch_apk.yml
    with:
      frida_version: 16.2.1

  patch-apk-latest:
    needs: get-package
    if: needs.get-package.outputs.flow_skip != 'true'
    uses: ./.github/workflows/patch_apk.yml

  inital-analysis:
    needs: [uni_env, get-package]
    if: |
      needs.uni_env.outputs.run_analyze == 'true' && 
      needs.get-package.outputs.flow_skip != 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/analyze.yml
    secrets: inherit
    with:
      artifact_name: application.apk
      binary_name: libil2cpp.so
  
  il2cpp-dumper:
    needs: [uni_env, inital-analysis]
    if: needs.uni_env.outputs.run_analyze == 'true'
    permissions:
      actions: write
      contents: write
    uses: ./.github/workflows/il2cppdumper.yml
    secrets: inherit
    with:
      artifact_name: initial_analysis
      binary_name: libil2cpp.so
  
  analysis-release:
    runs-on: ubuntu-latest
    needs: [uni_env, get-package, patch-apk-fixed, patch-apk-latest, inital-analysis, il2cpp-dumper]
    permissions:
      contents: write
    
    steps:  
      - name: Download xapk artifact
        uses: actions/download-artifact@v7
        with:
          name: application.xapk
          path: release
      
      - name: Download apk artifact
        uses: actions/download-artifact@v7
        with:
          name: application.apk
          path: release

      - name: Download patched APK artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: patched-apk-frida-*
          merge-multiple: true
          path: release

      - name: Download initial analysis
        uses: actions/download-artifact@v7
        with:
          name: initial_analysis
          path: initial_analysis
      
      - name: Download il2cpp analysis
        uses: actions/download-artifact@v7
        with:
          name: il2cpp_analysis
          path: il2cpp_analysis

      - name: Prepare for release
        env:
          APP_VERSION: ${{ needs.get-package.outputs.app_version }}
        run: |
          PLATFORM="android"
          TITLE="Android"

          VERSION=$APP_VERSION
          RELEASE_TAG="v${VERSION}_${PLATFORM}"
          RELEASE_TITLE="${VERSION} ${TITLE}"

          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV

          (cd initial_analysis && zip -r ../release/initial_analysis.zip .)
          (cd il2cpp_analysis && zip -r ../release/il2cpp_analysis.zip .)

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_TITLE }}
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*  

          overwrite_files: true
          make_latest: false
          fail_on_unmatched_files: false